# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # SDK-pinned — managed via .flutter-version
      - dependency-name: "flutter"
      - dependency-name: "flutter_localizations"
    groups:
      riverpod:
        patterns:
          - "*riverpod*"
      flutter-packages:
        patterns:
          - "flutter_*"
      pub-packages:
        patterns:
          - "*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"

  # Android Gradle: AGP/Kotlin plugins in android/settings.gradle.kts and the
  # Gradle wrapper in android/gradle/wrapper/gradle-wrapper.properties.
  # Check the Flutter tooling's supported AGP/Gradle/KGP range before merging.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
