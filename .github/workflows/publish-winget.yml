name: Publish Winget

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.12)"
        required: true
        type: string
      version:
        description: "Package version without v prefix (e.g. 0.1.12)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        type: string
      version:
        description: "Package version without v prefix"
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Install winget
        uses: Cyberboss/install-winget@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          wget_release_id: latest

      - name: Install wingetcreate
        run: winget install wingetcreate --disable-interactivity --accept-source-agreements

