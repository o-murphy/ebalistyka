name: Tests

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "packages/**"
      - "tools/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "Makefile"
      - ".flutter-version"
      - ".github/workflows/test.yml"
      - ".github/actions/flutter/**"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version-file: .flutter-version
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - run: make test
