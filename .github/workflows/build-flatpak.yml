name: Build Flatpak

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - "lib/**"
      - "linux/**"
      - "external/**"
      - "packages/bclibc_ffi/**"
      - "pubspec.yaml"
      - "flatpak/**"
      - ".github/workflows/build-flatpak.yml"
  workflow_call:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        type: string   # amd64 | arm64
      build_name:
        description: "Version name override (leave empty to use pubspec.yaml)"
        required: false
        type: string
        default: ""
      retention_days:
        description: "Artifact retention in days"
        required: false
        type: number
        default: 2
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_url:
        description: "URL to download the artifact"
        value: ${{ jobs.build.outputs.artifact_url }}
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "amd64"
        type: choice
        options: [ amd64, arm64 ]
      build_name:
        description: "Version name override (leave empty to use pubspec.yaml)"
        required: false
        default: ""
        type: string

concurrency:
  group: build-flatpak-${{ github.ref }}-${{ inputs.arch || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: flatpak-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64","arm64"]') || fromJSON(format('["{0}"]', inputs.arch || 'amd64')) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      issues: write

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_url:  ${{ steps.upload.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set build metadata
        id: meta
        run: |
          BUILD_NAME="${{ inputs.build_name }}"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | sed 's/+.*//')
          fi
          BUILD_NAME="${BUILD_NAME#v}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_NAME="${BUILD_NAME%%-*}-pr.${{ github.event.number }}"
          fi
          BUILD_NUMBER=$(git rev-list --count --first-parent HEAD)
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "amd64" ]; then ARCH_SUFFIX="x86_64"; else ARCH_SUFFIX="aarch64"; fi
          echo "build_name=$BUILD_NAME"     >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "arch_suffix=$ARCH_SUFFIX"   >> $GITHUB_OUTPUT
          echo "bundle=ebalistyka_linux_${ARCH_SUFFIX}.flatpak" >> $GITHUB_OUTPUT
          echo "artifact_name=ebalistyka-flatpak-${ARCH_SUFFIX}-${BUILD_NAME}-${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Determine tag or branch
        id: resolve-ref
        shell: bash
        run: |
          # Якщо inputs.tag_name передано і це реальний тег
          if [[ -n "${{ inputs.tag_name }}" ]] && git rev-parse --verify "refs/tags/${{ inputs.tag_name }}" 2>/dev/null; then
            echo "ref_type=tag" >> $GITHUB_OUTPUT
            echo "ref_value=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "✅ Using existing tag: ${{ inputs.tag_name }}"
          else
            # Якщо тегу немає - використовуємо branch
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME#refs/heads/}}"
            echo "ref_type=branch" >> $GITHUB_OUTPUT
            echo "ref_value=$BRANCH" >> $GITHUB_OUTPUT
            echo "⚠️ Tag not found, using branch: $BRANCH"
          fi

      - uses: o-murphy/flutpak/.github/actions/prepare@v0.2.7
        with:
          tag_name: ${{ steps.resolve-ref.outputs.ref_value }}
          flutter_version_file: flatpak/flutter.version
          validate: 'false'
          flutpak_ref: v0.2.7

      # - name: Verify Flatpak manifest is pinned
      #   uses: o-murphy/flutpak/.github/actions/verify@v0.2.7
      #   with:
      #     manifest: flatpak/io.github.o_murphy.ebalistyka.yml
      #     flutpak_ref: v0.2.7

      # - name: Read Flutter version
      #   id: flutter-ver
      #   run: echo "version=$(cat flatpak/flutter.version)" >> $GITHUB_OUTPUT

      # - name: Install Flutter ${{ steps.flutter-ver.outputs.version }}
      #   run: |
      #     FLUTTER_DIR="$RUNNER_TEMP/flutter"
      #     git clone --depth 1 \
      #       --branch "${{ steps.flutter-ver.outputs.version }}" \
      #       https://github.com/flutter/flutter.git \
      #       "$FLUTTER_DIR"
      #     echo "$FLUTTER_DIR/bin" >> $GITHUB_PATH
      #     echo "FLUTTER_ROOT=$FLUTTER_DIR" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get

      - name: Upload generated sources as artifact
        uses: actions/upload-artifact@v7
        with:
          name: generated-sources-${{ steps.meta.outputs.arch_suffix }}
          path: flatpak/generated-sources.json
          retention-days: 2

      - name: Install flatpak and appstream
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak appstream

      - name: Validate metainfo
        run: |
          appstreamcli validate --explain --no-net \
            flatpak/io.github.o_murphy.ebalistyka.metainfo.xml

      - name: Cache Flatpak installation (org.flatpak.Builder + runtimes)
        uses: actions/cache@v5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-builder-25.08-llvm20-${{ runner.arch }}-v1

      - name: Cache flatpak-builder downloads
        uses: actions/cache@v5
        with:
          path: .flatpak-builder/downloads
          key: flatpak-dl-${{ steps.meta.outputs.arch_suffix }}-${{ hashFiles('flatpak/io.github.o_murphy.ebalistyka.yml', 'pubspec.lock', 'flatpak/flutter.version') }}
          restore-keys: flatpak-dl-${{ steps.meta.outputs.arch_suffix }}-

      - name: Install org.flatpak.Builder
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          dbus-run-session flatpak install --user -y --noninteractive flathub \
            org.flatpak.Builder

      - name: Lint manifest
        run: |
          dbus-run-session flatpak run \
            --filesystem=host \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            manifest flatpak/io.github.o_murphy.ebalistyka.yml

      - name: Configure GitHub token for flatpak-builder
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Build Flatpak
        run: |
          dbus-run-session flatpak run --command=flathub-build org.flatpak.Builder \
            flatpak/io.github.o_murphy.ebalistyka.yml

      - name: Lint Flatpak repo
        run: |
          dbus-run-session flatpak run \
            --filesystem=host \
            --command=flatpak-builder-lint \
            org.flatpak.Builder \
            --exceptions \
            repo repo

      - name: Export .flatpak bundle
        run: |
          flatpak build-bundle \
            --arch="${{ steps.meta.outputs.arch_suffix }}" \
            repo \
            "${{ steps.meta.outputs.bundle }}" \
            io.github.o_murphy.ebalistyka

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.bundle }}
          retention-days: ${{ inputs.retention_days || 2 }}
          if-no-files-found: error

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/pr-summary
        with:
          platform: Linux Flatpak (${{ matrix.arch }})
          build_result: ${{ job.status }}
          artifact_name: ${{ steps.meta.outputs.artifact_name }}
          artifact_url: ${{ steps.upload.outputs.artifact-url }}
