name: Build Flatpak

on:
  # pull_request:
  #   branches: [ main, develop ]
  #   paths:
  #     - "lib/**"
  #     - "linux/**"
  #     - "external/**"
  #     - "packages/bclibc_ffi/**"
  #     - "pubspec.yaml"
  #     - "flatpak/**"
  #     - ".github/workflows/build-flatpak.yml"
  workflow_call:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        type: string   # amd64 | arm64
      build_name:
        description: "Version name override (leave empty to use pubspec.yaml)"
        required: false
        type: string
        default: ""
      retention_days:
        description: "Artifact retention in days"
        required: false
        type: number
        default: 30
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_url:
        description: "URL to download the artifact"
        value: ${{ jobs.build.outputs.artifact_url }}
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "amd64"
        type: choice
        options: [ amd64, arm64 ]
      build_name:
        description: "Version name override (leave empty to use pubspec.yaml)"
        required: false
        default: ""
        type: string

concurrency:
  group: build-flatpak-${{ github.ref }}-${{ inputs.arch || 'amd64' }}
  cancel-in-progress: true

jobs:
  build:
    name: flatpak-${{ inputs.arch || 'amd64' }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_url:  ${{ steps.upload.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set build metadata
        id: meta
        run: |
          BUILD_NAME="${{ inputs.build_name }}"
          if [ -z "$BUILD_NAME" ]; then
            BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | sed 's/+.*//')
          fi
          BUILD_NAME="${BUILD_NAME#v}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_NAME="${BUILD_NAME%%-*}-pr.${{ github.event.number }}"
          fi
          BUILD_NUMBER=$(git rev-list --count --first-parent HEAD)
          ARCH="${{ inputs.arch || 'amd64' }}"
          if [ "$ARCH" = "amd64" ]; then ARCH_SUFFIX="x86_64"; else ARCH_SUFFIX="aarch64"; fi
          COMMIT=$(git rev-parse HEAD)
          REF_TYPE="${{ github.ref_type }}"
          TAG="${{ github.ref_name }}"
          if [ "$REF_TYPE" != "tag" ]; then TAG=""; fi
          echo "build_name=$BUILD_NAME"     >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "arch_suffix=$ARCH_SUFFIX"   >> $GITHUB_OUTPUT
          echo "commit=$COMMIT"             >> $GITHUB_OUTPUT
          echo "tag=$TAG"                   >> $GITHUB_OUTPUT
          echo "artifact_name=ebalistyka-flatpak-${ARCH_SUFFIX}-${BUILD_NAME}-${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Patch manifest for current tag/commit
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          python3 - "$TAG" "$COMMIT" "flatpak/io.github.o_murphy.ebalistyka.yml" << 'PYEOF'
          import sys

          tag, commit, path = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = open(path).readlines()
          out = []
          i = 0

          # Pass 1: update app source tag + commit
          # If tag is empty, remove the tag: line (commit-only source)
          in_app_source = False
          while i < len(lines):
              line = lines[i]
              if 'github.com/o-murphy/ebalistyka-app.git' in line:
                  in_app_source = True
                  out.append(line)
              elif in_app_source and line.lstrip().startswith('tag:'):
                  if tag:
                      indent = len(line) - len(line.lstrip())
                      out.append(' ' * indent + f'tag: {tag}\n')
                  # else: drop the tag: line (commit-only is valid)
              elif in_app_source and line.lstrip().startswith('commit:'):
                  indent = len(line) - len(line.lstrip())
                  out.append(' ' * indent + f'commit: {commit}\n')
                  in_app_source = False
              else:
                  out.append(line)
              i += 1

          # Pass 2: remove temporary backport patches (not needed for tags after v0.1.14)
          TEMP_PATCHES = ('bclibc_ffi_plugin_cmake.patch', 'linux_cmake_bclibc_conditional.patch')
          lines, out = out, []
          i = 0
          while i < len(lines):
              line = lines[i]
              if (line.lstrip().startswith('- type: patch')
                      and i + 1 < len(lines)
                      and any(p in lines[i + 1] for p in TEMP_PATCHES)):
                  i += 2  # skip "- type: patch" + "  path: ..." lines
              else:
                  out.append(line)
                  i += 1

          open(path, 'w').writelines(out)
          label = tag if tag else commit[:12]
          print(f"  manifest patched: ref={label}, commit={commit[:12]}")

          # Pass 3: pin metainfo.xml screenshot URLs from /main/ to tag or commit
          metainfo_path = 'flatpak/io.github.o_murphy.ebalistyka.metainfo.xml'
          ref = tag if tag else commit
          content = open(metainfo_path).read()
          patched = content.replace(
              'raw.githubusercontent.com/o-murphy/ebalistyka-app/main/',
              f'raw.githubusercontent.com/o-murphy/ebalistyka-app/{ref}/'
          )
          if patched != content:
              open(metainfo_path, 'w').write(patched)
              print(f"  metainfo patched: screenshot URLs → {ref}")
          PYEOF

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat flatpak/flutter.version)" >> $GITHUB_OUTPUT

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Flutter ${{ steps.flutter-ver.outputs.version }}
        run: |
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          git clone --depth 1 \
            --branch "${{ steps.flutter-ver.outputs.version }}" \
            https://github.com/flutter/flutter.git \
            "$FLUTTER_DIR"
          echo "$FLUTTER_DIR/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$FLUTTER_DIR" >> $GITHUB_ENV

      - name: Build flatpak_gen
        run: |
          git clone --depth 1 \
            https://github.com/o-murphy/flutter_flatpak_gen.git \
            /tmp/flatpak_gen_tool
          cd /tmp/flatpak_gen_tool
          dart pub get
          dart compile exe bin/flatpak_gen.dart -o /tmp/flatpak_gen

      - name: Generate Flatpak sources
        run: |
          FLUTTER_TOOLS_DIR="$FLUTTER_ROOT/packages/flutter_tools"
          FLUTTER_TOOLS_LOCK="$FLUTTER_TOOLS_DIR/pubspec.lock"
          # pubspec.lock may not be committed in this Flutter version — resolve it.
          if [ ! -f "$FLUTTER_TOOLS_LOCK" ]; then
            echo "flutter_tools/pubspec.lock not found, resolving via dart pub get..."
            (cd "$FLUTTER_TOOLS_DIR" && dart pub get --no-example 2>&1)
          fi
          if [ ! -f "$FLUTTER_TOOLS_LOCK" ]; then
            echo "ERROR: could not resolve $FLUTTER_TOOLS_LOCK"
            exit 1
          fi
          /tmp/flatpak_gen sources \
            --lock pubspec.lock \
            --lock "$FLUTTER_TOOLS_LOCK" \
            --sdk "$FLUTTER_ROOT" \
            --output flatpak/generated-sources.json \
            --patch patches/flutter/shared.sh.patch

      - name: Verify generated sources
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('flatpak/generated-sources.json')); print(len(d))")
          echo "Total entries: $COUNT"
          JANN=$(python3 -c "
          import json
          d = json.load(open('flatpak/generated-sources.json'))
          versions = sorted(set(
            s['dest'].split('json_annotation-')[1]
            for s in d
            if s.get('type') == 'archive' and 'json_annotation-' in s.get('dest','')
          ))
          print(' '.join(versions) if versions else 'MISSING')
          ")
          echo "json_annotation versions in cache: $JANN"
          if [[ "$JANN" == *"4.9"* ]]; then
            echo "✓ json_annotation 4.9.x present (needed by flutter_tools)"
          else
            echo "ERROR: json_annotation 4.9.x missing — flutter_tools bootstrap will fail"
            exit 1
          fi

      - name: Upload generated sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-sources-${{ steps.meta.outputs.arch_suffix }}
          path: flatpak/generated-sources.json
          retention-days: 7

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-25.08-llvm20-${{ runner.arch }}

      - name: Cache flatpak-builder downloads
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-dl-${{ hashFiles('flatpak/io.github.o_murphy.ebalistyka.yml', 'pubspec.lock', 'flatpak/flutter.version') }}-${{ runner.arch }}
          restore-keys: |
            flatpak-dl-${{ runner.arch }}-

      - name: Install flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Build Flatpak (source build)
        run: |
          ARCH_SUFFIX="${{ steps.meta.outputs.arch_suffix }}"
          flatpak-builder \
            --sandbox \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=stable \
            --repo=.flatpak-repo \
            --state-dir=.flatpak-builder \
            --arch="${ARCH_SUFFIX}" \
            .flatpak-build \
            flatpak/io.github.o_murphy.ebalistyka.yml

      - name: Export .flatpak bundle
        run: |
          ARCH_SUFFIX="${{ steps.meta.outputs.arch_suffix }}"
          mkdir -p artifacts/flatpak
          flatpak build-bundle \
            --arch="${ARCH_SUFFIX}" \
            .flatpak-repo \
            "artifacts/flatpak/ebalistyka_linux_${ARCH_SUFFIX}.flatpak" \
            io.github.o_murphy.ebalistyka \
            stable

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: artifacts/flatpak/
          retention-days: ${{ inputs.retention_days || 30 }}
          if-no-files-found: error

  pr-summary:
    needs: [ build ]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      issues: write
    uses: ./.github/workflows/pr-summary.yml
    with:
      platform: Linux Flatpak (${{ inputs.arch || 'amd64' }})
      build_result: ${{ needs.build.result }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      artifact_url: ${{ needs.build.outputs.artifact_url }}
