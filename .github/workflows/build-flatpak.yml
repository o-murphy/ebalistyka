name: Build Flatpak

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "linux/**"
      - "external/**"
      - "packages/bclibc_ffi/**"
      - "pubspec.yaml"
      - "flatpak/**"
      - "scripts/ci-common.sh"
      - "scripts/package-flatpak.sh"
      - ".github/workflows/build-flatpak.yml"
  workflow_call:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        type: string   # amd64 | arm64
      build_name:
        description: "Version name override (leave empty to use pubspec.yaml)"
        required: false
        type: string
        default: ""
      retention_days:
        description: "Artifact retention in days"
        required: false
        type: number
        default: 2
      tag:
        description: "Git tag to build"
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_url:
        description: "URL to download the artifact"
        value: ${{ jobs.build.outputs.artifact_url }}
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "amd64"
        type: choice
        options: [ amd64, arm64 ]
      build_name:
        description: "Version name override (leave empty to use pubspec.yaml)"
        required: false
        default: ""
        type: string
      tag:
        description: "Git tag to build"
        required: false
        default: ""
        type: string

concurrency:
  group: build-flatpak-${{ github.ref }}-${{ inputs.arch || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    name: flatpak-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64","arm64"]') || fromJSON(format('["{0}"]', inputs.arch || 'amd64')) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      issues: write

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_url:  ${{ steps.upload.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
    
      - name: Set build metadata
        id: meta
        shell: bash
        env:
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          MATRIX_ARCH: ${{ matrix.arch }}
          PR_NUMBER: ${{ github.event.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source scripts/ci-common.sh
          source scripts/package-flatpak.sh
          set_build_metadata "ebalistyka-flatpak"
          set_flatpak_bundle_output

      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat flatpak/flutter.version)" >> $GITHUB_OUTPUT

      - name: Install Flutter ${{ steps.flutter-ver.outputs.version }}
        id: flutter 
        uses: o-murphy/flutpak/.github/actions/flutter@v0.4.0-beta.2
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          cache: true

      - name: Set FLUTTER_ROOT
        run: echo "FLUTTER_ROOT=${{ steps.flutter.outputs.flutter-path }}" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get

      - name: Install flutpak
        uses: o-murphy/flutpak/.github/actions/setup-flutpak@v0.4.0-beta.2

      - name: Set ref type
        id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "flag=--tag" >> $GITHUB_OUTPUT
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "flag=--commit" >> $GITHUB_OUTPUT
            echo "value=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Flutpak generate
        run: |
          flutpak generate \
            ${{ steps.ref.outputs.flag }} "${{ steps.ref.outputs.value }}" \
            --sdk "$FLUTTER_ROOT"

      - name: Upload submission artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flutpak-artifacts-${{ steps.meta.outputs.arch_suffix }}
          path: |
            flatpak/generated/io.github.o_murphy.ebalistyka.yml
            flatpak/generated/generated-sources.json
            flatpak/generated/patches
            flatpak/generated/flathub.json
          retention-days: 2

      - name: Install flatpak and appstream
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          install_flatpak_and_appstream
      
      - name: Validate metainfo
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          validate_metainfo app/share/metainfo/io.github.o_murphy.ebalistyka.metainfo.xml

      - name: Cache Flatpak installation (org.flatpak.Builder + runtimes)
        uses: actions/cache@v5
        with:
          path: ~/.local/share/flatpak
          key: flatpak-builder-25.08-llvm20-${{ runner.arch }}-v1

      - name: Cache flatpak-builder downloads
        uses: actions/cache@v5
        with:
          path: .flatpak-builder/downloads
          key: flatpak-dl-${{ steps.meta.outputs.arch_suffix }}-${{ hashFiles('flatpak/generated/io.github.o_murphy.ebalistyka.yml', 'pubspec.lock', 'flatpak/flutter.version') }}
          restore-keys: flatpak-dl-${{ steps.meta.outputs.arch_suffix }}-

      - name: Install org.flatpak.Builder
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          install_flatpak_builder

      - name: Lint manifest
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          lint_flatpak_manifest flatpak/generated/io.github.o_murphy.ebalistyka.yml

      - name: Configure GitHub token for flatpak-builder
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.GITHUB_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Build Flatpak
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          build_flatpak flatpak/generated/io.github.o_murphy.ebalistyka.yml
      
      - name: Lint Flatpak repo
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          lint_flatpak_repo repo

      - name: Export .flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          source scripts/package-flatpak.sh
          export_flatpak_bundle \
            "${{ steps.meta.outputs.arch_suffix }}" \
            repo \
            "${{ steps.meta.outputs.bundle }}" \
            io.github.o_murphy.ebalistyka

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.bundle }}
          retention-days: ${{ inputs.retention_days || 2 }}
          if-no-files-found: error

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/pr-summary
        with:
          platform: Linux Flatpak (${{ matrix.arch }})
          build_result: ${{ job.status }}
          artifact_name: ${{ steps.meta.outputs.artifact_name }}
          artifact_url: ${{ steps.upload.outputs.artifact-url }}
