name: ebalistyka
version: '0.1.9-dev'
summary: Ballistic calculator
description: |
  eBalistyka is a professional ballistic calculator for shooters.
  Supports trajectory calculation, wind drift, multiple ammo profiles,
  and custom reticle overlays.

confinement: strict
base: core22
grade: devel

lint:
  ignore:
    - library

apps:
  ebalistyka:
    command: ebalistyka
    extensions: [gnome]
    plugs:
      - network
      - home

parts:
  ebalistyka:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    flutter-channel: stable
    override-pull: |
      craftctl default
      # Pin the Flutter SDK to the project version (3.47.9). The flutter plugin
      # only clones a channel, and newer stable Flutter breaks nativeapi 0.5.10.
      # The plugin skips its own clone when flutter-distro already exists.
      git clone --depth 1 -b 3.47.9 https://github.com/flutter/flutter.git "$CRAFT_PART_BUILD/flutter-distro"
      "$CRAFT_PART_BUILD/flutter-distro/bin/flutter" precache --linux
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - lld
      - llvm
    stage-packages:
      - libstdc++6
